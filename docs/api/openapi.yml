components:
  schemas:
    AcceptOrderRequest:
      type: object
      properties:
        preparation_minutes:
          type: integer
          maximum: 120
          minimum: 5
    AddToCartRequest:
      type: object
      properties:
        menu_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 20
          minimum: 1
          default: 1
        variant_id:
          type: string
          format: uuid
          nullable: true
        addon_ids:
          type: array
          items:
            type: string
            format: uuid
        special_instructions:
          type: string
          default: ''
          maxLength: 255
        replace_cart:
          type: boolean
          default: false
      required:
      - menu_item_id
    AddonGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 60
        min_select:
          type: integer
          maximum: 32767
          minimum: 0
        max_select:
          type: integer
          maximum: 32767
          minimum: 0
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
        options:
          type: array
          items:
            $ref: '#/components/schemas/MenuAddon'
      required:
      - id
      - name
      - options
    AddonGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        min_select:
          type: integer
          maximum: 32767
          minimum: 0
        max_select:
          type: integer
          maximum: 32767
          minimum: 0
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
        options:
          type: array
          items:
            $ref: '#/components/schemas/MenuAddonRequest'
      required:
      - name
      - options
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          $ref: '#/components/schemas/LabelEnum'
        name:
          type: string
          description: Custom label e.g. 'Mom's place'
          maxLength: 80
        contact_name:
          type: string
          maxLength: 120
        contact_phone:
          type: string
          pattern: ^\+[1-9]\d{7,14}$
          maxLength: 16
        address_line1:
          type: string
          description: Flat / house / building
          maxLength: 255
        address_line2:
          type: string
          description: Street / area
          maxLength: 255
        landmark:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        postal_code:
          type: string
          maxLength: 10
        lat:
          type: number
          format: double
          readOnly: true
        lng:
          type: number
          format: double
          readOnly: true
        is_default:
          type: boolean
        delivery_instructions:
          type: string
          maxLength: 255
        formatted:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line1
      - city
      - created_at
      - formatted
      - id
      - lat
      - lng
    AddressRequest:
      type: object
      properties:
        label:
          $ref: '#/components/schemas/LabelEnum'
        name:
          type: string
          description: Custom label e.g. 'Mom's place'
          maxLength: 80
        contact_name:
          type: string
          maxLength: 120
        contact_phone:
          type: string
          pattern: ^\+[1-9]\d{7,14}$
          maxLength: 16
