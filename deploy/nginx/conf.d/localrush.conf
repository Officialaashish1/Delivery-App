# Replace api.localrush.in with your domain. HTTPS via Let's Encrypt (see deploy/scripts/init-letsencrypt.sh).
upstream api_upstream { server api:8000; keepalive 32; }
upstream ws_upstream  { server ws:8001; }

server {
  listen 80;
  server_name api.localrush.in;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name api.localrush.in;
  ssl_certificate     /etc/letsencrypt/live/api.localrush.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.localrush.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:10m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /static/ { alias /srv/static/; expires 30d; access_log off; }
  location /media/  { alias /srv/media/;  expires 7d;  access_log off; }

  location /ws/ {
    proxy_pass http://ws_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s; proxy_send_timeout 3600s;
  }

  location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/conf.d/proxy-params.inc;
  }
  location /api/v1/payments/webhooks/ {
    proxy_pass http://api_upstream;            # no rate limit for the payment provider
    include /etc/nginx/conf.d/proxy-params.inc;
  }
  location / {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/conf.d/proxy-params.inc;
  }
}
