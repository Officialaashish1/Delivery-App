org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# compileSdk 36 is newer than the AGP 8.7 tested range; it builds fine.
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
ksp.useKSP2=false

# ---- Release configuration (override in ~/.gradle/gradle.properties, local.properties or env) ----
# LOCALRUSH_API_BASE_URL=https://api.localrush.in/api/v1/
# LOCALRUSH_WS_BASE_URL=wss://api.localrush.in/ws/
# LOCALRUSH_KEYSTORE_FILE=/path/to/release.jks
# LOCALRUSH_KEYSTORE_PASSWORD=...
# LOCALRUSH_KEY_ALIAS=localrush
# LOCALRUSH_KEY_PASSWORD=...
