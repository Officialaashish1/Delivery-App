<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocalRush Admin · Sign in</title>
<style>
:root{--orange:#F26B1D;--charcoal:#23272F;--bg:#F6F7F9}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);display:grid;place-items:center;min-height:100vh;color:var(--charcoal)}
.card{background:#fff;padding:36px 32px;border-radius:20px;width:min(380px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}.logo i{width:38px;height:38px;border-radius:12px;background:var(--orange);display:grid;place-items:center;color:#fff;font-weight:800;font-style:normal}
h1{font-size:20px;margin:0}label{display:block;font-size:13px;margin:14px 0 6px;color:#555}
input{width:100%;padding:12px 14px;border:1px solid #e3e5ea;border-radius:12px;font-size:15px}input:focus{outline:2px solid var(--orange);border-color:transparent}
button{width:100%;margin-top:20px;padding:13px;background:var(--orange);color:#fff;border:0;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer}
.err{background:#fde8e8;color:#b42318;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:14px}
</style></head><body>
<form class="card" method="post">{% csrf_token %}
<div class="logo"><i>LR</i><h1>LocalRush Admin</h1></div>
<label>Mobile number</label><input name="phone" placeholder="+91 98765 43210" autofocus required>
<label>Password</label><input name="password" type="password" required>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<button type="submit">Sign in</button>
</form></body></html>
